<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Claude 会话管理</title>
  <link rel="stylesheet" href="dist/main.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span>会话列表</span>
        <button id="btn-refresh">刷新</button>
      </div>
      <div id="session-list"></div>
    </aside>
    <main id="terminal-pane">
      <div id="status-bar">未运行 — 点击左侧会话恢复，或点分组行 <b>+</b> 新建会话</div>
      <div id="terminal"></div>
    </main>
  </div>
  <script src="dist/main.js"></script>
</body>
</html>
