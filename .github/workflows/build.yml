name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: go.sum

      - name: 安装 MinGW Windows 交叉编译器（Fyne 依赖 CGO）
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: 交叉编译 Windows exe
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -ldflags "-s -w" -o claude-sidebar.exe ./src

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: claude-sidebar-windows
          path: claude-sidebar.exe

      - name: 更新 dev 版产物（每次 push main 覆盖，只留最新）
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: dev（最新构建）
          files: claude-sidebar.exe
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
          make_latest: false

      - name: 发布 GitHub Release（仅打 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: claude-sidebar.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
