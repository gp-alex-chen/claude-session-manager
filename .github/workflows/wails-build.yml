name: wails-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*-wails', 'v*-wails-pre', 'v*-wails-rc']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Go packages
        run: go test ./...
      - name: Vet Go packages
        run: go vet ./...

  build:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Cross-compile Windows executable
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          REF: ${{ github.ref_name }}
        run: |
          VER="${REF}"
          [[ "${VER}" == v* ]] || VER="dev-${VER}"
          go build -tags "webview2 production" \
            -ldflags "-s -w -H windowsgui -X github.com/gp-alex-chen/claude-session-manager/internal/app.Version=${VER}" \
            -o claude-terminal.exe .
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: claude-terminal-windows
          path: claude-terminal.exe
      - name: Publish GitHub Release for wails tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: claude-terminal.exe
          generate_release_notes: true
          prerelease: ${{ endsWith(github.ref_name, '-pre') || endsWith(github.ref_name, '-rc') }}
