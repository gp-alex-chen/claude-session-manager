<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Claude 会话管理</title>
  <!-- 本文件会被复制到 dist/，故资源路径相对 dist 根 -->
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div class="brand"><span class="brand-dot"></span><span>Claude 会话管理</span></div>
        <span class="header-btns">
          <button id="btn-eye" title="折叠时显示运行中的会话（点击切换）"></button>
          <button id="btn-hidden">归档(<span id="hidden-count">0</span>)</button>
        </span>
      </div>
      <div id="hidden-panel" class="hidden-panel hidden"></div>
      <div id="session-list"></div>
      <div id="sidebar-footer">
        <button id="btn-settings" title="设置"><span class="gear">⚙</span>设置</button>
      </div>
    </aside>
    <main id="terminal-pane">
      <div id="status-bar">未运行 — 点击左侧会话恢复，或点分组行 <b>+</b> 新建会话</div>
      <div id="terminal"></div>
    </main>
  </div>
  <div
    id="settings-menu"
    class="settings-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="settings-title"
    aria-hidden="true"
    hidden
  >
    <section id="settings-dialog" class="settings-dialog" role="document">
      <header class="settings-header">
        <div>
          <h2 id="settings-title">设置</h2>
          <span id="settings-version" class="settings-version"></span>
        </div>
        <button id="settings-close" type="button" aria-label="关闭设置">×</button>
      </header>
      <div class="settings-layout">
        <nav id="settings-nav" class="settings-nav" aria-label="设置分类">
          <button
            id="settings-tab-appearance"
            type="button"
            role="tab"
            data-category="appearance"
            aria-controls="settings-panel-appearance"
          >外观</button>
          <button
            id="settings-tab-terminal"
            type="button"
            role="tab"
            data-category="terminal"
            aria-controls="settings-panel-terminal"
          >终端</button>
          <button
            id="settings-tab-update"
            type="button"
            role="tab"
            data-category="update"
            aria-controls="settings-panel-update"
          >更新</button>
        </nav>
        <div id="settings-content" class="settings-content">
          <section
            id="settings-panel-appearance"
            class="settings-panel"
            data-panel="appearance"
            role="tabpanel"
            aria-labelledby="settings-tab-appearance"
          ></section>
          <section
            id="settings-panel-terminal"
            class="settings-panel"
            data-panel="terminal"
            role="tabpanel"
            aria-labelledby="settings-tab-terminal"
            hidden
          ></section>
          <section
            id="settings-panel-update"
            class="settings-panel"
            data-panel="update"
            role="tabpanel"
            aria-labelledby="settings-tab-update"
            hidden
          ></section>
        </div>
      </div>
    </section>
  </div>
  <script src="main.js"></script>
</body>
</html>
