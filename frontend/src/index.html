<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TheOne</title>
  <!-- 本文件会被复制到 dist/，故资源路径相对 dist 根 -->
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <div id="provider-filters" role="group" aria-label="会话来源筛选"></div>
        <span class="header-btns">
          <button id="btn-hidden">归档<span id="hidden-count"></span></button>
        </span>
      </div>
      <label id="session-search-control">
        <span aria-hidden="true">⌕</span>
        <input id="session-search" type="search" placeholder="搜索项目或会话" aria-label="搜索项目或会话" autocomplete="off">
      </label>
      <section id="project-bar" aria-label="项目">
        <div class="project-bar-header">
          <span class="project-bar-title">项目</span>
          <span class="project-bar-actions">
            <button id="btn-opened-only" type="button" aria-pressed="false">已打开 0</button>
            <button id="btn-eye" type="button" title="折叠时显示运行中的会话（点击切换）"></button>
            <button id="btn-add-project" type="button" title="添加项目">+</button>
          </span>
        </div>
      </section>
      <div id="session-list"></div>
      <div id="sidebar-footer">
        <button id="btn-settings" title="设置"><span class="gear">⚙</span>设置</button>
        <span id="update-notice" class="update-notice" role="status" aria-live="polite" aria-hidden="true" hidden></span>
      </div>
    </aside>
    <div id="sidebar-divider" role="separator" aria-label="调整侧栏宽度" aria-orientation="vertical" aria-valuemin="220" aria-valuemax="360" aria-valuenow="280" tabindex="0"></div>
    <main id="terminal-pane">
      <div id="workspace-toolbar">
        <button id="btn-sidebar-toggle" type="button" aria-label="收起侧栏" aria-controls="sidebar" aria-expanded="true">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div id="workspace-context"><span id="workspace-project">终端工作区</span><span id="workspace-directory"></span></div>
        <div id="account-quota" hidden></div>
      </div>
      <div id="terminal"></div>
      <div id="status-bar" role="status" aria-live="polite">
        <span id="status-message"></span><span id="workspace-summary">0 个会话已打开</span>
      </div>
    </main>
  </div>
  <div id="archive-overlay" class="archive-overlay" hidden>
    <section id="archive-dialog" role="dialog" aria-modal="true" aria-labelledby="archive-title">
      <header class="archive-header"><span id="archive-title">归档会话</span><button id="btn-close-archive" type="button" aria-label="关闭归档">×</button></header>
      <input id="archive-search" type="search" placeholder="搜索归档会话" aria-label="搜索归档会话" autocomplete="off">
      <div id="hidden-panel" class="hidden-panel hidden"></div>
    </section>
  </div>
  <div
    id="settings-menu"
    class="settings-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="settings-title"
    aria-hidden="true"
    hidden
  >
    <section id="settings-dialog" class="settings-dialog" role="document">
      <header class="settings-header">
        <div>
          <h2 id="settings-title">设置</h2>
          <span id="settings-version" class="settings-version"></span>
        </div>
        <button id="settings-close" type="button" aria-label="关闭设置">×</button>
      </header>
      <div class="settings-layout">
        <nav id="settings-nav" class="settings-nav" role="tablist" aria-label="设置分类">
          <button
            id="settings-tab-appearance"
            type="button"
            role="tab"
            data-category="appearance"
            aria-controls="settings-panel-appearance"
          >外观</button>
          <button
            id="settings-tab-terminal"
            type="button"
            role="tab"
            data-category="terminal"
            aria-controls="settings-panel-terminal"
          >终端</button>
          <button
            id="settings-tab-update"
            type="button"
            role="tab"
            data-category="update"
            aria-controls="settings-panel-update"
          >更新</button>
        </nav>
        <div id="settings-content" class="settings-content">
          <section
            id="settings-panel-appearance"
            class="settings-panel"
            data-panel="appearance"
            role="tabpanel"
            aria-labelledby="settings-tab-appearance"
          ></section>
          <section
            id="settings-panel-terminal"
            class="settings-panel"
            data-panel="terminal"
            role="tabpanel"
            aria-labelledby="settings-tab-terminal"
            hidden
          ></section>
          <section
            id="settings-panel-update"
            class="settings-panel"
            data-panel="update"
            role="tabpanel"
            aria-labelledby="settings-tab-update"
            hidden
          ></section>
        </div>
      </div>
    </section>
  </div>
  <script src="main.js"></script>
</body>
</html>
